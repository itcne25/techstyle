name: CI Pipeline

on:
  push:
    branches:
      - main
      - "day_*"
  pull_request:
    branches:
      - main
      - "day_*"

jobs:
  lint:
    name: Code Quality (flake8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Linter
        run: |
          flake8 tests/ conftest.py \
            --max-line-length=100 \
            --ignore=E302,W503

  test:
    name: Automated Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Unit Tests with Coverage
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # SonarQube is optional; restore a complete job when its service is configured.

  build:
    name: Build Package Artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package (sdist + wheel)
        run: python -m build

      # Upload build artifact, für eine kurzzeitige Speicherung und späteren Download, z.B. für Tests oder Deployment.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: techstyle-dist
          path: dist/
          retention-days: 14 # Keep the artifact for 14 days

      # Publish package to pypiserver (eigene Python registry) - optional, falls ein privater PyPI-Server verwendet wird.
      # Voraussetzung: Die Secrets PYPISERVER_REPOSITORY_URL, PYPISERVER_USERNAME und PYPISERVER_PASSWORD müssen in den Repository-Einstellungen unter "Settings" > "Secrets and variables" > "Actions" hinzugefügt werden.
      # PYPi server muss installiert und konfiguriert sein, um Pakete zu empfangen.
