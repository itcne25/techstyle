sonar.projectKey=techstyle
sonar.projectName=TechStyle

sonar.sources=.
sonar.exclusions=.venv/**,venv/**,static/**,templates/**,tests/**,docs/**,dist/**,build/**,*.egg-info/**
sonar.tests=tests

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Fail the pipeline (not just the dashboard) when the Quality Gate is red.
sonar.qualitygate.wait=true
