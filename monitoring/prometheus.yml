# Merge this scrape job into the existing Tag-10 Prometheus configuration.
# AWS credentials come from the instance role or the service environment.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: techstyle-node
    ec2_sd_configs:
      - region: us-east-1
        port: 9100
        refresh_interval: 60s
        filters:
          - name: instance-state-name
            values: [running]
          - name: tag:Monitoring
            values: [techstyle]
    relabel_configs:
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance
      - source_labels: [__meta_ec2_tag_Name]
        target_label: ec2_name
